[project]
name = "rmi"
version = "0.1.0"
description = "Reward Model Inspection: bias, reward-hacking and injection-attack probes for HF reward models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.2",
    "transformers>=4.46,<5",
    "tokenizers>=0.20",
    "sentencepiece>=0.2",
    "datasets>=2.19",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "statsmodels>=0.14",
    "streamlit>=1.38",
    "plotly>=5.22",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rmi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
